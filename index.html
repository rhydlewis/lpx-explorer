<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LPX Explorer</title>
    <style>
      /*
       * Pre-React splash. Painted by the webview before any JS bundle
       * has loaded — gives the user something to look at during the
       * 5-15s vite-dev-mode cold-start window. ReactDOM.render() blows
       * this away on first paint by replacing #root's contents.
       *
       * Honours the app's dark palette (mirrored from styles/tokens.css)
       * so there's no flash when React takes over.
       */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #1d1d1f;
        color: #f5f5f7;
        font-family: -apple-system, system-ui, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        height: 100%;
      }
      .pre-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        text-align: center;
      }
      .pre-splash h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .pre-splash em {
        font-style: italic;
        font-weight: 400;
        color: rgba(245, 245, 247, 0.7);
      }
      .pre-splash p {
        font-size: 11px;
        color: rgba(245, 245, 247, 0.5);
        margin: 0;
      }
      .pre-splash .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(245, 245, 247, 0.2);
        border-top-color: #5e9eff;
        border-radius: 50%;
        animation: pre-splash-spin 0.9s linear infinite;
        margin-top: 4px;
      }
      @keyframes pre-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-splash .spinner { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="pre-splash">
        <h1>LPX <em>Explorer</em></h1>
        <p>Loading…</p>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
