[workspace]
members = ["crates/*"]

[package]
name = "lpx-explorer"
version = "0.0.8"
description = "Read-only inspector for Logic Pro .logicx project bundles"
authors = ["Rhyd Lewis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lpx_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
lpx-parser = { path = "crates/lpx-parser" }
tauri-plugin-store = "2.4.3"
# Used by src/lib/goatcounter.ts to fire a one-time anonymous install
# (or upgrade) ping to GoatCounter on app boot. The Rust webview's
# `fetch` would be subject to mixed-content / CORS rules — the HTTP
# plugin bypasses that and is scoped via capabilities/default.json to
# only the GoatCounter endpoint.
tauri-plugin-http = "2.5.9"
# Used by the `tlog!` diagnostic logger to stamp wall-clock time on every
# line. Already in Cargo.lock as a transitive dep; explicitly depending
# costs nothing in build time / binary size.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Sparkle auto-updater (lpx-explorer-tat). Native macOS update UI;
# Sparkle handles dialog / progress / 'Remind Me Later' / background
# checks so we don't have to. EdDSA-signed updates verified against
# SUPublicEDKey in Info.plist. macOS-only since the Sparkle framework
# is macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-sparkle-updater = "0.2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

